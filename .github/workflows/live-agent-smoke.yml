name: Local Ollama nine-agent smoke test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  local-ollama-smoke:
    name: Run nine real agents on a local model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTHVEST_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      ARTHVEST_AGENT_MODEL: llama3.2:1b
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || (cat /tmp/ollama.log; exit 1)

      - name: Download the local model
        run: ollama pull llama3.2:1b

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: backend

      - name: Run nine-agent local-model smoke test
        run: python -m scripts.smoke_test_research_agents
        working-directory: backend
