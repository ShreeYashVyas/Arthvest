name: Live Macro Source Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-macro-source-check.yml"
      - "backend/app/services/macro_service.py"
      - "backend/scripts/check_data_sources.py"

permissions:
  contents: read

jobs:
  source-check:
    name: Validate live FRED sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Check configured live sources
        run: python scripts/check_data_sources.py
        working-directory: backend
