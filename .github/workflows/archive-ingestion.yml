name: Archive Macro Observations

on:
  workflow_dispatch:
  schedule:
    # 02:00 UTC is 07:30 in India (IST).
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: macro-archive-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch and verify archive writes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Require a configured database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add DATABASE_URL in repository Settings → Secrets and variables → Actions. The secret value is never printed."
            exit 1
          fi

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Fetch indicators and verify persisted checks
        working-directory: backend
        run: python -m scripts.ingest_macro_archive
